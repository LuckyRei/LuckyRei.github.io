<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./css/home_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <title>SkyHome - Startseite</title>
</head>

<body>

    <div class="background-decor" id="decorContainer"></div>

    <h1>SkyHome</h1>
    <p>Willkommen auf meiner Seite! Wähle eine Kategorie:</p>

    <div class="search-container">
        <input type="text" id="categorySearch" placeholder="🔍 Kategorie suchen...">
    </div>

    <div class="filter-tabs">
        <button class="tab-btn active" data-filter="all">Alle</button>
        <button class="tab-btn" data-filter="spiele">Spiele</button>
        <button class="tab-btn" data-filter="wissen">Wissen & Lernen</button>
        <button class="tab-btn" data-filter="tools">Tools & Lifestyle</button>
    </div>

    <div class="category-grid" id="categoryGrid"></div>

    <audio id="buttonSound" src="./sounds/button.mp3" preload="auto"></audio>

    <div id="modusModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitel">Wähle eine Option</h2>
            <div id="modalListe"></div>
            <button id="schliessenBtn" class="menu-btn danger-btn">Schließen</button>
        </div>
    </div>

    <script>
        function playButtonFX(element) {
            const sound = document.getElementById("buttonSound");
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(() => {});
            }
            
            element.classList.add('animate__animated', 'animate__bounceIn');
            setTimeout(() => {
                element.classList.remove('animate__animated', 'animate__bounceIn');
            }, 1000);
        }

        async function oeffneModal(kategorieData) {
            const modal = document.getElementById("modusModal");
            const titel = document.getElementById("modalTitel");
            const container = document.getElementById("modalListe");

            titel.textContent = kategorieData.titel;
            container.innerHTML = "<p style='opacity:0.7;'>In Kürze verfügbar!</p>";
            modal.style.display = "flex";
        }

        async function ladeKategorien() {
            try {
                const response = await fetch("./json/kategorien.json");
                const kategorien = await response.json();
                const grid = document.getElementById("categoryGrid");
                grid.innerHTML = "";

                kategorien.forEach(kat => {
                    const card = document.createElement("div");
                    card.className = `category-card ${kat.verfuegbar ? '' : 'disabled'}`;
                    card.setAttribute("data-category", kat.kategorie);

                    const badgeText = kat.verfuegbar ? "VERFÜGBAR" : "BALD";
                    const badgeClass = kat.verfuegbar ? "active" : "soon";

                    card.innerHTML = `
                        <span class="badge ${badgeClass}">${badgeText}</span>
                        <h3>${kat.titel}</h3>
                        <p>${kat.beschreibung}</p>
                    `;

                    // Korrigierter Maus-Leuchteffekt
                    card.addEventListener('mousemove', (e) => {
                        const rect = card.getBoundingClientRect();
                        card.style.setProperty('--x', `${e.clientX - rect.left}px`);
                        card.style.setProperty('--y', `${e.clientY - rect.top}px`);
                    });

                    card.addEventListener('click', () => {
                        playButtonFX(card);
                        if (kat.verfuegbar) {
                            if (kat.link) {
                                setTimeout(() => window.location.href = kat.link, 300);
                            } else {
                                oeffneModal(kat);
                            }
                        }
                    });

                    grid.appendChild(card);
                });
            } catch (error) {
                console.error("Fehler beim Laden der Kategorien:", error);
            }
        }

        // Funktion zum Erstellen einzelner Blasen mit automatischem Cleanup
        function spawnBubble() {
            const container = document.getElementById('decorContainer');
            if (!container) return;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            const size = Math.random() * 50 + 25;
            const duration = Math.random() * 6 + 6; // 6s bis 12s
            
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.left = `${Math.random() * 100}%`;
            bubble.style.animationDuration = `${duration}s`;

            container.appendChild(bubble);

            // Nach Ablauf der Animation das Element komplett aus dem DOM entfernen
            setTimeout(() => {
                bubble.remove();
            }, duration * 1000);
        }

        document.addEventListener("DOMContentLoaded", () => {
            ladeKategorien();

            // Anfangs ein paar Blasen erzeugen
            for (let i = 0; i < 8; i++) {
                setTimeout(spawnBubble, i * 400);
            }
            // Danach regelmäßig neue Blasen nachspawnen
            setInterval(spawnBubble, 800);

            document.body.classList.add(`theme-${Math.floor(Math.random() * 6) + 1}`);

            const modal = document.getElementById("modusModal");
            document.getElementById("schliessenBtn").addEventListener("click", (e) => {
                playButtonFX(e.currentTarget);
                setTimeout(() => modal.style.display = "none", 150);
            });

            window.addEventListener("click", (e) => {
                if (e.target === modal) modal.style.display = "none";
            });

            document.getElementById('categorySearch').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                document.querySelectorAll('.category-card').forEach(card => {
                    const text = card.textContent.toLowerCase();
                    card.style.display = text.includes(term) ? "block" : "none";
                });
            });

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    
                    const filter = e.target.getAttribute('data-filter');
                    document.querySelectorAll('.category-card').forEach(card => {
                        const cat = card.getAttribute('data-category');
                        card.style.display = (filter === 'all' || cat === filter) ? "block" : "none";
                    });
                });
            });
        });
    </script>
</body>

</html>
